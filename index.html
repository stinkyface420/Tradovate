<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tradovate</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tradovate">
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    body {
      background: #1a1a1d;
      color: #e6e6e6;
      font-family: -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    img { width: 96px; height: 96px; border-radius: 22px; margin-bottom: 20px; }
    h1 { font-size: 22px; margin: 0 0 10px; }
    p { color: #9a9aa0; font-size: 16px; line-height: 1.5; max-width: 300px; }
    b { color: #4d8dff; }
  </style>
  <script>
    // Redirect only when launched from the home screen icon
    if (window.navigator.standalone === true) {
      window.location.replace("https://trader.tradovate.com/");
    }
  </script>
</head>
<body>
  <img src="icon.png" alt="Tradovate icon">
  <h1>Almost there</h1>
  <p>Tap the <b>Share</b> button below, then choose <b>Add to Home Screen</b>. Launching from that icon opens Tradovate fullscreen.</p>
</body>
</html>
