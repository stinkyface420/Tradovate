<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tradovate</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tradovate">
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #1a1a1d;
      overflow: hidden;
    }
    iframe {
      border: none;
      width: 100%;
      height: 100%;
      position: fixed;
      top: 0;
      left: 0;
    }
    #hint {
      color: #9a9aa0;
      font-family: -apple-system, sans-serif;
      font-size: 15px;
      text-align: center;
      padding: 40vh 30px 0;
    }
  </style>
</head>
<body>
  <div id="hint">Loading Tradovate…<br><br>If this stays blank for more than 10 seconds, Tradovate is blocking embedded mode — tell Claude and we'll revert.</div>
  <iframe src="https://trader.tradovate.com/" allow="fullscreen"></iframe>
</body>
</html>
